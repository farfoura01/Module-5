<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS Fan Website</title>
    <link rel="stylesheet" href="main.css">
	<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
	<link rel="stylesheet" href="/resources/demos/style.css">
	    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.0/jquery-ui.js"></script>
   
</head>
<body>
        <header>
    <h1>Welcome to BTS Flexbox World</h1>
    <img src="logoo.webp" alt="BTS Logo" class="logo">
</header>
	
<div id="draggable" style="text-align: center;">
    <img src="bb.webp" alt="Draggable Image" style="width: 70%; height: 50%; object-fit: cover;">
</div>
	   <script>
        $(document).ready(function() {
            $("#draggable").draggable();
        });
    </script>



    <main class="flex-container">
        <section class="column">
            <div class="box"><img src="rmv.jpg" alt="RM"><p>RM</p></div>
            <div class="box"><img src="jin.jpg" alt="Jin"><p>Jin</p></div>
            <div class="box"><img src="suga.jpg" alt="Suga"><p>Suga</p></div>
        </section>
        
        <section class="row">
            <div class="box"><img src="jhope.jpg" alt="J-Hope"><p>J-Hope</p></div>
            <div class="box"><img src="jimin.jpg" alt="Jimin"><p>Jimin</p></div>
            <div class="box"><img src="v.jpg" alt="V"><p>V</p></div>
            <div class="box"><img src="jk..jpg" alt="Jungkook"><p>Jungkook</p></div>
        </section>
    </main>
    
    <footer>
        <p>Stay tuned for more BTS updates!</p>
        <button id="armyButton">ARMY Button</button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
